services:
  hybride:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    volumes:
      - ./conf/hybride.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
  classique:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    volumes:
      - ./conf/classique.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro


