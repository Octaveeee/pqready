server {
    listen 443 ssl;
    server_name faible;

    ssl_certificate     /etc/nginx/certs/faible.crt;
    ssl_certificate_key /etc/nginx/certs/faible.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "AES128-SHA:ECDHE-RSA-AES128-SHA:@SECLEVEL=0";
    ssl_prefer_server_ciphers on;

    location / {
        return 200 "lab faible\n";
    }
}