[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqready"
version = "0.1.0"
description = "Quantum readiness scanner for TLS endpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pqready = "pqready.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: scans the Docker lab (run inside the tools image)"]
